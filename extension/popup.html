<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light; }
  body {
    width: 360px; margin: 0; padding: 14px;
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #2C2C2A; background: #FFFFFF;
  }
  h1 { font-size: 14px; font-weight: 500; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #B4B2A9; flex: none; }
  .dot.on { background: #1D9E75; }
  .dot.off { background: #E24B4A; }
  .muted { color: #5F5E5A; font-size: 12px; }
  button {
    font: inherit; padding: 6px 12px; margin-right: 6px; cursor: pointer;
    border: 0.5px solid #B4B2A9; border-radius: 8px;
    background: #F1EFE8; color: #2C2C2A;
  }
  button:hover { background: #E6F1FB; border-color: #378ADD; }
  button:disabled { opacity: .5; cursor: default; }
  #meta { margin-top: 10px; font-size: 12px; color: #5F5E5A; word-break: break-all; }
  pre {
    margin: 8px 0 0; padding: 8px; max-height: 200px; overflow: auto;
    background: #F1EFE8; border-radius: 8px; font-size: 12px;
    white-space: pre-wrap; word-break: break-word;
  }
</style>
</head>
<body>
  <h1>WorkBuddy 页面读取桥</h1>

  <div class="row">
    <span id="dot" class="dot"></span>
    <span id="status" class="muted">正在检查桥接服务…</span>
  </div>

  <div>
    <button id="read">读取当前页</button>
    <button id="copy" disabled>复制正文</button>
  </div>

  <div id="meta"></div>
  <pre id="out" hidden></pre>

  <script src="popup.js"></script>
</body>
</html>
